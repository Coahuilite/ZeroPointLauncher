name: Cleanroom core and private workspace

on:
  push:
    paths:
      - 'cleanroom/**'
      - 'docs/cleanroom/**'
      - 'tools/*check-share.ps1'
      - '.github/workflows/cleanroom.yml'
      - '.gitignore'
      - '.gitattributes'
      - 'README.MD'
  pull_request:
    paths:
      - 'cleanroom/**'
      - 'docs/cleanroom/**'
      - 'tools/*check-share.ps1'
      - '.github/workflows/cleanroom.yml'
      - '.gitignore'
      - '.gitattributes'
      - 'README.MD'

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Check public text and scanner regressions
        shell: pwsh
        run: |
          & ./tools/check-share.ps1 -Tracked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/test-check-share.ps1
      - name: Test cores and private workspace story
        shell: bash
        run: bash cleanroom/gradlew -p cleanroom --no-daemon :layerfs:test :layerfs:run :workspace-nio:test :workspace-nio:run
